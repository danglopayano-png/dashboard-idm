<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objetivos IDM 2026</title>
<style>:root{--color-fg:#1e2a33;--color-fg-muted:#6b7780;--color-panel:#fff;--color-border-line:#c9ced3;--color-bg:#fff;--font-anthropic-sans:"Segoe UI",Calibri,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--color-fg:#e7ecef;--color-fg-muted:#9aa6ad;--color-panel:#1b2127;--color-border-line:#37424b;--color-bg:#12171b}}
body{margin:0;background:var(--color-bg);padding:clamp(8px,1.6vw,24px)}</style>
<style>
#dash-root{--dash-gutter:clamp(8px,1.6vw,24px)}
.ob{--blue:#1b5e84;--purple:#7030a0;--lime:#88e113;--green:#1cc76c;--greyseg:#dbdbdb;--box:rgba(128,128,128,.12);--dash-line:#a6caec;
 font-family:var(--font-anthropic-sans);color:var(--color-fg);max-width:1500px;margin:0 auto}
@media (prefers-color-scheme:dark){.ob{--blue:#7fb8de;--purple:#c19be0;--greyseg:#4a4f55;--dash-line:#3d5a73}}
.ob-head{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px}
.ob-head h1{font-family:var(--font-anthropic-sans);font-weight:700;font-size:clamp(26px,3.6vw,44px);color:var(--blue);margin:0}
.ob-head img{width:clamp(30px,3.6vw,46px);height:auto}
.ob-grid{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));grid-template-rows:auto auto auto;gap:0 14px}
.ob-side{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--purple);font-weight:700;font-size:clamp(15px,1.6vw,20px);display:flex;align-items:center;justify-content:center;text-align:center}
.ob-s1{grid-row:2;grid-column:1}.ob-s2{grid-row:3;grid-column:1}
.ob-row1,.ob-row2,.ob-row3{display:contents}
.ob-card{border:1px solid var(--color-border-line);border-radius:14px;padding:0 14px;min-width:0;background:var(--color-panel)}
.ob-c1{border-bottom:0;border-radius:14px 14px 0 0;padding-top:12px}
.ob-c2{border-top:0;border-bottom:0;border-radius:0}
.ob-c3{border-top:0;border-radius:0 0 14px 14px;padding-bottom:12px}
.ob-t{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;min-height:34px}
.ob-t b{font-weight:700;font-size:clamp(15px,1.5vw,20px);color:var(--blue)}
.ob-t img{position:absolute;right:0;top:0;width:clamp(24px,2.4vw,34px);height:auto}
.ob-d{text-align:center;color:var(--color-fg-muted);font-size:clamp(11px,1vw,14px);line-height:1.35;margin:10px 0 14px;min-height:4em}
.ob-c2{border-top:1.5px dashed var(--dash-line);border-bottom:1.5px dashed var(--dash-line);padding-top:22px;padding-bottom:22px;display:flex;align-items:center;justify-content:center}
.ob-box{background:var(--box);border-radius:8px;width:84%;display:flex;align-items:center;justify-content:center;padding:14px 4px;min-height:92px}
.ob-box span{font-family:var(--font-anthropic-sans);font-weight:700;font-size:clamp(34px,4.4vw,58px);color:var(--blue);font-variant-numeric:tabular-nums;line-height:1}
.ob{position:relative}
.ob-box{position:relative}
.ob-nota{position:absolute;right:8px;bottom:4px;max-width:78%;text-align:right;font-size:9px;line-height:1.25;color:var(--color-fg-muted)}
.ob .zone{transition:opacity .12s}.ob .zone.has{cursor:pointer}.ob .zone.has:hover{opacity:.82}
.ob-tip{position:absolute;z-index:20;pointer-events:none;background:var(--color-panel);color:var(--color-fg);border:1px solid var(--color-border-line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.18);padding:10px 12px;font-size:12px;min-width:210px;max-width:290px;display:none}
.ob-tip h4{margin:0 0 6px;font-size:12.5px;color:var(--blue)}
.ob-tip table{border-collapse:collapse;width:100%}
.ob-tip td{white-space:nowrap;padding:2px 0;font-variant-numeric:tabular-nums}
.ob-tip td+td{text-align:right;padding-left:14px;font-weight:600}
.ob-tip td.m{color:var(--color-fg-muted);font-weight:400}
.ob-tip tr.nv td{border-top:1px dashed var(--color-border-line);padding-top:5px;color:var(--purple);font-weight:700}
.ob-tip .fn{margin-top:6px;font-size:10px;color:var(--color-fg-muted);line-height:1.3}
.ob-leg{display:flex;gap:14px;font-size:11px;color:var(--color-fg-muted);padding-top:10px}
.ob-leg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.ob-g{padding-top:4px;max-width:420px;margin:0 auto}
.ob-g svg{display:block;width:100%;height:auto}
.ob-ritmo{text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;margin-top:6px}.ob-ritmo b{font-size:14px}.ob-ritmo span{color:var(--color-fg-muted)}
.ob-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px}
.ob-note{font-size:12px;color:var(--color-fg-muted);line-height:1.5}
.ob-logo{width:clamp(70px,8vw,104px);height:auto;flex:none}
@media (max-width:820px){
 .ob-grid{grid-template-columns:1fr 1fr;gap:12px}
 .ob-side{display:none}
 .ob-grid{grid-template-rows:none}
 .ob-card{border:1px solid var(--color-border-line);border-radius:14px!important;grid-column:auto!important;grid-row:auto!important}
 .ob-c2{border-top:1.5px dashed var(--dash-line)!important;border-bottom:1.5px dashed var(--dash-line)!important;border-radius:0!important}
}
</style><style>
body.locked #objetivos{visibility:hidden}
#pwGate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:var(--color-bg);font-family:var(--font-anthropic-sans)}
body.locked #pwGate{display:flex}
#pwGate .box{background:var(--color-panel);color:var(--color-fg);border:1px solid var(--color-border-line);border-radius:12px;padding:28px 32px;width:min(92vw,340px);text-align:center}
#pwGate h2{margin:0 0 6px;font-size:18px}
#pwGate p{margin:0 0 16px;font-size:13px;color:var(--color-fg-muted)}
#pwGate input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;border:1px solid var(--color-border-line);border-radius:8px;background:var(--color-bg);color:var(--color-fg)}
#pwGate button{margin-top:12px;width:100%;padding:10px;font-size:15px;border:0;border-radius:8px;background:#1b5e84;color:#fff;cursor:pointer}
#pwGate .err{display:none;margin-top:10px;font-size:13px;color:#c0392b}
#pwGate .err.show{display:block}

function arcPath(a0,a1,ri,R){const p=(a,r)=>[(Math.sin(a)*r).toFixed(2),(-Math.cos(a)*r).toFixed(2)];

const mk=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;};
function tipContent(r,zone){
 const d=r.desglose; if(!d) return null;
 const box=document.createDocumentFragment();
 if(r.id==='cobranza'||r.id==='margen'){
  box.appendChild(mk('h4',(r.id==='margen'?'% margen estimado por cliente · ':'% cobrado por cliente · ')+(d.periodo||'')+(r.id==='margen'?' (producción a la derecha)':' (monto facturado a la derecha)')));
  const tb=mk('table');
  d.clientes.forEach(c=>{const tr=mk('tr');tr.appendChild(mk('td',c.cliente));
   const td=mk('td',fmt1(c.pct)+'%');td.style.color=r.id==='margen'?(c.pct>=r.objetivo?'var(--green)':(c.pct>=10?'#d89a00':'#e2453c')):(c.pct>=98?'var(--green)':(c.pct>=90?'#d89a00':'#e2453c'));tr.appendChild(td);
   tr.appendChild(mk('td','S/ '+fmt1(c.facturado!=null?c.facturado:c.monto)+' MM','m'));tb.appendChild(tr);});
  box.appendChild(tb); if(d.nota) box.appendChild(mk('div',d.nota,'fn')); return box;
 }
 const money=r.id==='produccion', fm=v=>money?'S/ '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' MM':fmtN(v);
 const lista=zone==='falta'?d.falta:d.actual; if(!lista) return null;
 const tot=lista.reduce((a,x)=>a+x.valor,0)+(zone==='falta'?d.nueva_venta:0);
 box.appendChild(mk('h4',zone==='falta'?(r.nombre+': falta para el objetivo ('+fm(tot)+')'):(r.nombre+' actual por cliente ('+fm(tot)+')')));
 const tb=mk('table');
 lista.forEach(x=>{const tr=mk('tr');tr.appendChild(mk('td',x.cliente));
  tr.appendChild(mk('td',(zone==='falta'?'+':'')+fm(x.valor)));
  tr.appendChild(mk('td',Math.round(x.valor/tot*100)+'%','m'));tb.appendChild(tr);});
 if(zone==='falta'){const tr=mk('tr','', 'nv');tr.appendChild(mk('td','Nueva venta'));tr.appendChild(mk('td','+'+fm(d.nueva_venta)));tr.appendChild(mk('td',Math.round(d.nueva_venta/tot*100)+'%'));tb.appendChild(tr);}
 box.appendChild(tb);
 if(zone==='falta') box.appendChild(mk('div','Estimación: '+(d.nueva_venta_pct||30)+'% a nueva venta y el resto repartido según la participación actual de cada cliente.','fn'));
 return box;

   let x=e.clientX-b.left+16,y=e.clientY-b.top-h-10; if(x+w>b.width) x=e.clientX-b.left-w-16; if(y<0) y=e.clientY-b.top+16;
   TIP.style.left=Math.max(0,x)+'px';TIP.style.top=y+'px';};
